  <style>
    :root {
      --bg: #02060e;
      --card-bg: rgba(6, 16, 32, 0.75);
      --cyan: #00e5ff;
      --cyan-glow: rgba(0, 229, 255, 0.35);
      --text-primary: #f0f6fc;
      --text-muted: #8b9eb3;
      --font-serif: 'EB Garamond', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-serif);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(0, 229, 255, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 80% 85%, rgba(220, 20, 80, 0.05) 0%, transparent 50%);
    }

    .video-viewport-wrapper {
      width: 100%;
      max-width: 1380px;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #010409;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.85), 0 0 1px 1px rgba(0, 229, 255, 0.25);
      aspect-ratio: 16 / 9;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* Interactive clickable hotspot for arXiv citation on top right */
    .arxiv-hotspot {
      position: absolute;
      top: 7.2%;
      right: 3.75%;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      color: var(--cyan);
      font-family: var(--font-serif);
      font-size: clamp(14px, 1.45vw, 24px);
      letter-spacing: 0.02em;
      background: rgba(2, 6, 14, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 229, 255, 0.4);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 20;
      cursor: pointer;
    }

    .arxiv-hotspot:hover {
      background: rgba(0, 229, 255, 0.15);
      border-color: var(--cyan);
      box-shadow: 0 0 20px var(--cyan-glow);
      transform: translateY(-1px);
    }

    .arxiv-hotspot svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      transition: transform 0.2s ease;
    }

    .arxiv-hotspot:hover svg {
      transform: translate(2px, -2px);
    }

    /* Minimalist luxury control bar */
    .metadata-bar {
      width: 100%;
      max-width: 1380px;
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 229, 255, 0.15);
      border-radius: 10px;
    }

    .meta-brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #ffffff;
    }

    .brand-subtitle {
      font-size: 14px;
      font-style: italic;
      color: var(--text-muted);
    }

    .action-links {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      background: rgba(0, 229, 255, 0.08);
    }

    .action-btn.primary {
      background: rgba(0, 229, 255, 0.12);
      border-color: rgba(0, 229, 255, 0.4);
      color: var(--cyan);
    }

    .action-btn.primary:hover {
      background: rgba(0, 229, 255, 0.22);
      box-shadow: 0 0 16px var(--cyan-glow);
    }

    @media (max-width: 768px) {
      .metadata-bar {
        flex-direction: column;
        gap: 14px;
        align-items: flex-start;
      }
      .action-links {
        width: 100%;
        justify-content: flex-start;
        flex-wrap: wrap;
      }
    }
  </style>
</head>
