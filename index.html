          <h1>Point Reyes Sound — Quantum Boltzmann Solver</h1>
          <p><strong>We develop accelerated quantum chemistry solvers for advanced materials simulation and future quantum computers.</strong></p>
          <p>Continuous phase-space kinetics for strongly correlated electrons and entropic regularization of mean-field singularities via Quantum Boltzmann Equation Self-Consistent-Field (QBE-SCF).</p>
          <p>Point Reyes Sound is excited to join Alchemist Chicago’s final selection stage in Chicago, October 19–23, as one of 30 companies selected for the program. <a href="/news/alchemist-chicago-2026">Read institutional announcement &rarr;</a> &bull; <a href="https://polsky.uchicago.edu/2026/10/19/meet-the-30-semifinalists-in-alchemist-chicagos-second-cohort/" target="_blank" rel="noopener noreferrer">Read UChicago Polsky Center press release &rarr;</a></p>

        <section>
          <h2>About Point Reyes Sound — Discovery Without Deference</h2>
          <p>Point Reyes Sound develops accelerated quantum chemistry solvers for advanced materials simulation and future quantum computers. We pioneer continuous kinetic transport methods for strongly correlated electrons, replacing combinatorial configuration interaction (CI) bottlenecks with polynomial O(N³) computational scaling.</p>
          <h3>Core Scientific Pillars</h3>
          <ul>
            <li><strong>01 Non-Equilibrium Kinetic Theory:</strong> Propagating reduced density matrices with BGK collision operators, replacing combinatorial CI scaling with polynomial O(N³) computational scaling.</li>
            <li><strong>02 Open Scientific Benchmarking:</strong> Open reproducibility across reference transition-metal dimers, radical singlet-triplet gaps, and multi-reference bond dissociations.</li>
          </ul>
        </section>

        <section>
          <h2>Research Themes &amp; Commercial Applications</h2>
          <ul>
            <li><strong>Semiconductor EDA &amp; Wide-Bandgap Materials:</strong> Kinetic carrier transport and electron-phonon scattering simulation for GaN, SiC, and topological insulators.</li>
            <li><strong>Solid-State Battery Electrolytes &amp; Clean Energy:</strong> Simulating open-shell radical stability and non-equilibrium charge transfer at cathode-electrolyte interphases.</li>
            <li><strong>Industrial Catalysis &amp; Active Sites:</strong> Resolving multi-metallic transition complexes and nitrogenase active sites without factorial active-space blowup.</li>
            <li><strong>Fault-Tolerant Quantum Algorithm Compilation (FTQC):</strong> 1,747× reduction in Toffoli gate complexity for active-space driven quantum simulations on Cr₂.</li>
          </ul>
        </section>
